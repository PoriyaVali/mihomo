name: Managed server embedding
on:
  pull_request:
    paths: ['listener/**', 'transport/socks5/**', 'transport/anytls/**', 'transport/sudoku/**', 'transport/shadowtls/**', 'transport/vless/vision/**', 'component/ca/**', 'third_party/smux/**', 'go.mod', '.github/workflows/managed-server.yml']
  workflow_dispatch:
jobs:
  managed-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - name: Queued multiplexing payload ownership
        working-directory: third_party/smux
        run: go test -race -timeout 3m -skip '^Test(8GBTransfer|RandomLengthRandomDataTransfer)V[12]$' .
      - name: Authentication and listener lifecycle regressions
        env:
          GOEXPERIMENT: jsonv2
        run: >-
          go test -race -timeout 3m ./transport/socks5 ./component/ca ./transport/anytls/session ./listener/http ./listener/inbound
          -run 'TestKeepAliveRequestWith(FailedCredentialsIsRejected|outCredentialsKeepsVerifiedUser)|TestShadowQuicProgrammaticDialerPreservesConfigEquality|TestStreamCloseConcurrentWithReadAndLateHook|TestAuthenticatedAssociationReply|TestRejectedAssociationDoesNotSucceedOnClient|TestAuthenticationMethodMustBeOffered|TestInbound(Vmess_TLS|Vless_TLS|AnyTLS_TLS|Hysteria2_TLS|TrustTunnel_H2|TrustTunnel_QUIC)$|TestInbound(Mieru|ShadowQuic|Sudoku|Snell)UpdateUsersKeepsOtherSessions|TestInboundMieruUDPAssociationsHaveTheirOwnSource|TestInboundSudokuUsers(Attribution|RejectsForeignKeys)|TestInboundSnellUsers(NeedTheirOwnPSK|Options)'
